<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1070" role="img" aria-labelledby="title desc">
  <title id="title">De la frase de la empresa al código CNO</title>
  <desc id="desc">La frase declarada y su contexto entran a cinco búsquedas sobre el catálogo CNO: tres léxicas por BM25 y dos vectoriales por similitud coseno. Los rankings se fusionan, un ordenamiento con siete criterios deja diez candidatos con su traza, y la persona elige y sustenta la decisión, que queda registrada.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#171717"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#111827" stroke-opacity=".045" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="1070" fill="#f8f7f2"/>
  <rect width="900" height="1070" fill="url(#grid)"/>

  <text x="48" y="58" fill="#171717" font-family="system-ui, sans-serif" font-size="24" font-weight="800">De la frase de la empresa al código CNO</text>
  <text x="48" y="88" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="15">Cinco búsquedas en paralelo, una fusión y una decisión que queda sustentada.</text>

  <rect x="48" y="112" width="804" height="108" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text x="72" y="138" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">LO QUE DECLARÓ LA EMPRESA</text>
  <text x="72" y="170" fill="#171717" font-family="system-ui, sans-serif" font-size="15" font-style="italic">«Encargado de aplicar herbicidas en los cultivos»</text>
  <text x="72" y="196" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="13">Texto libre, sin código y sin sinónimos: así llega siempre.</text>
  <line x1="466" y1="128" x2="466" y2="204" stroke="#d8d4cb" stroke-width="1.5"/>
  <text x="492" y="138" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">CONTEXTO PARA DESAMBIGUAR</text>
  <text x="492" y="166" fill="#171717" font-family="system-ui, sans-serif" font-size="13">Nivel educativo · Sector CIIU · Especialidad</text>
  <text x="492" y="188" fill="#171717" font-family="system-ui, sans-serif" font-size="13">Tareas declaradas · Remuneración</text>

  <line x1="450" y1="220" x2="450" y2="244" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="48" y="272" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">01 · RECUPERACIÓN SOBRE EL CATÁLOGO CNO</text>
  <text x="48" y="294" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="13">Cinco vías miran el mismo catálogo oficial desde ángulos distintos.</text>

  <rect x="48" y="306" width="252" height="84" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text x="68" y="330" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">LÉXICO · BM25</text>
  <text x="68" y="352" fill="#171717" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Título declarado</text>
  <text x="68" y="372" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">La denominación tal como llegó.</text>

  <rect x="318" y="306" width="252" height="84" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text x="338" y="330" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">LÉXICO · BM25</text>
  <text x="338" y="352" fill="#171717" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Función derivada</text>
  <text x="338" y="372" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">Frase inferida del nombre oficial.</text>

  <rect x="588" y="306" width="264" height="84" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text x="608" y="330" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">LÉXICO · BM25</text>
  <text x="608" y="352" fill="#171717" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Tareas y sector</text>
  <text x="608" y="372" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">El detalle operativo del puesto.</text>

  <rect x="48" y="402" width="390" height="112" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="68" y="428" fill="#c2410c" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">VECTORIAL · SIMILITUD COSENO</text>
  <text x="68" y="452" fill="#171717" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Función en 384 dimensiones</text>
  <text x="68" y="474" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">Compara el significado de la función con el de cada pasaje</text>
  <text x="68" y="492" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">del catálogo, sin depender de las palabras exactas.</text>

  <rect x="462" y="402" width="390" height="112" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="482" y="428" fill="#c2410c" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">VECTORIAL · SIMILITUD COSENO</text>
  <text x="482" y="452" fill="#171717" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Contexto completo</text>
  <text x="482" y="474" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">Nivel, sector y especialidad viajan en un mismo vector:</text>
  <text x="482" y="492" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">es lo que separa dos ocupaciones de nombre parecido.</text>

  <line x1="450" y1="514" x2="450" y2="538" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="48" y="550" width="390" height="104" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text x="68" y="574" fill="#b45309" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">02 · FUSIÓN DE RANKINGS</text>
  <text x="68" y="598" fill="#171717" font-family="system-ui, sans-serif" font-size="15" font-weight="700">BM25 + Reciprocal Rank Fusion</text>
  <text x="68" y="620" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">Los cinco rankings se suman y deduplican: un candidato</text>
  <text x="68" y="638" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">que aparece por varias vías sube de posición.</text>

  <rect x="462" y="550" width="390" height="104" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text x="482" y="574" fill="#b45309" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">03 · ORDENAMIENTO</text>
  <text x="482" y="598" fill="#171717" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Siete criterios, ninguno oculto</text>
  <text x="482" y="620" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">Función, acción, objeto, categoría, nivel, sector y título;</text>
  <text x="482" y="638" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">con penalizaciones explícitas cuando solo coincide el sector.</text>

  <line x1="450" y1="654" x2="450" y2="678" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="48" y="690" width="804" height="96" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/>
  <text x="72" y="714" fill="#b45309" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">04 · REVISIÓN</text>
  <text x="72" y="738" fill="#171717" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Diez candidatos, cada uno con su traza</text>
  <text x="72" y="760" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">Qué rama lo trajo, cuánto puntuó en cada componente, qué penalización recibió</text>
  <text x="72" y="778" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">y por qué quedó en esa posición. La revisión deja de ser una caja negra.</text>

  <line x1="450" y1="786" x2="450" y2="810" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="48" y="822" width="804" height="96" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="72" y="846" fill="#c2410c" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">05 · DECISIÓN HUMANA</text>
  <text x="72" y="870" fill="#171717" font-family="system-ui, sans-serif" font-size="15" font-weight="700">El analista elige y sustenta</text>
  <text x="72" y="892" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">El modelo reordena, nunca asigna. El código final, la evidencia y el sustento</text>
  <text x="72" y="910" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="12">los deja la persona que revisa.</text>

  <line x1="450" y1="918" x2="450" y2="942" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="48" y="954" width="804" height="88" rx="3" fill="#171717"/>
  <text x="72" y="978" fill="#f4c430" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="1">QUEDA REGISTRADO EN LA CRÍTICA</text>
  <text x="72" y="1002" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="13">Valor original · Resultado · Método · Confianza</text>
  <text x="72" y="1024" fill="#f5f5f5" font-family="system-ui, sans-serif" font-size="13">Evidencia · Sustento · Autor y fecha · Historial de cambios</text>
</svg>
