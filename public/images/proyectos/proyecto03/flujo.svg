<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Dos flujos para gestionar una búsqueda laboral</title>
  <desc id="desc">La aplicación registra postulaciones en SQLite y ejecuta búsquedas laborales con Codex. Un trabajador en Python valida oportunidades, actualiza el registro y exporta Excel.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#161616"/></marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f4c430"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#111827" stroke-opacity=".045" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="1120" fill="#f8f7f2"/><rect width="900" height="1120" fill="url(#grid)"/>
  <text x="56" y="64" fill="#171717" font-family="system-ui, sans-serif" font-size="25" font-weight="800">De la consulta al seguimiento</text>
  <text x="56" y="96" fill="#5b5b5b" font-family="system-ui, sans-serif" font-size="16">La IA investiga vacantes; la persona revisa la evidencia y decide.</text>
  <rect x="48" y="126" width="804" height="660" rx="4" fill="#fff" stroke="#171717" stroke-width="2"/>
  <rect x="48" y="126" width="804" height="44" fill="#f4c430"/>
  <text x="70" y="155" fill="#171717" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="1">BÚSQUEDA DE VACANTES CON IA</text>
  <g font-family="system-ui, sans-serif">
    <g><rect x="72" y="190" width="756" height="104" rx="3" fill="#fffdf5" stroke="#171717" stroke-width="2"/><rect x="72" y="190" width="8" height="104" fill="#f4c430"/><text x="102" y="221" fill="#b7791f" font-size="13" font-weight="800">01 / PERSONA</text><text x="102" y="255" fill="#171717" font-size="20" font-weight="800">Define la búsqueda</text><text x="375" y="231" fill="#454545" font-size="15">Elige tipo de puesto, preferencias y modelo.</text><text x="375" y="257" fill="#454545" font-size="15">Revisa cada oportunidad antes de postular.</text></g>
    <g><rect x="72" y="316" width="756" height="104" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/><text x="102" y="347" fill="#b7791f" font-size="13" font-weight="800">02 / APLICACIÓN</text><text x="102" y="381" fill="#171717" font-size="20" font-weight="800">PHP + SQLite</text><text x="375" y="357" fill="#454545" font-size="15">Valida y encola una búsqueda; muestra estado</text><text x="375" y="383" fill="#454545" font-size="15">e historial. Evita duplicar tareas en curso.</text></g>
    <g><rect x="72" y="442" width="756" height="104" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/><text x="102" y="473" fill="#b7791f" font-size="13" font-weight="800">03 / TRABAJADOR</text><text x="102" y="507" fill="#171717" font-size="20" font-weight="800">Python aislado</text><text x="375" y="483" fill="#454545" font-size="15">Carga perfil, fuentes y criterios desde una</text><text x="375" y="509" fill="#454545" font-size="15">copia temporal del espacio de búsqueda.</text></g>
    <g><rect x="72" y="568" width="756" height="104" rx="3" fill="#fff" stroke="#171717" stroke-width="2"/><text x="102" y="599" fill="#b7791f" font-size="13" font-weight="800">04 / INVESTIGACIÓN</text><text x="102" y="633" fill="#171717" font-size="20" font-weight="800">Codex CLI</text><text x="375" y="609" fill="#454545" font-size="15">Busca ofertas actuales, consulta enlaces</text><text x="375" y="635" fill="#454545" font-size="15">directos y aplica reglas de evaluación.</text></g>
    <g><rect x="72" y="694" width="756" height="72" rx="3" fill="#fffdf5" stroke="#171717" stroke-width="2"/><rect x="820" y="694" width="8" height="72" fill="#f4c430"/><text x="102" y="723" fill="#b7791f" font-size="13" font-weight="800">05 / RESULTADOS</text><text x="102" y="749" fill="#171717" font-size="18" font-weight="800">Valida · actualiza el registro · exporta a Excel</text></g>
  </g>
  <g fill="none" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"><path d="M450 296v16"/><path d="M450 422v16"/><path d="M450 548v16"/><path d="M450 674v16"/></g>
  <rect x="48" y="818" width="804" height="250" rx="4" fill="#171717"/>
  <text x="72" y="856" fill="#f4c430" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1">SEGUIMIENTO DE POSTULACIONES</text>
  <g font-family="system-ui, sans-serif">
    <text x="72" y="906" fill="#fff" font-size="19" font-weight="700">Registro web</text><text x="72" y="934" fill="#d5d5d5" font-size="14">Empresa, puesto, fechas</text><text x="72" y="956" fill="#d5d5d5" font-size="14">y notas</text>
    <path d="M300 926h76" fill="none" stroke="#f4c430" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="408" y="906" fill="#fff" font-size="19" font-weight="700">SQLite</text><text x="408" y="934" fill="#d5d5d5" font-size="14">Activas, vencidas</text><text x="408" y="956" fill="#d5d5d5" font-size="14">y rechazadas</text>
    <path d="M630 926h76" fill="none" stroke="#f4c430" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="738" y="906" fill="#fff" font-size="18" font-weight="700">Python</text><text x="738" y="934" fill="#d5d5d5" font-size="14">Métricas</text>
    <text x="72" y="1027" fill="#a7a7a7" font-size="13">El estado vencido se calcula al consultar: más de 15 días sin actualización.</text>
  </g>
</svg>
